<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07131f">
<title>海豹漫遊基隆</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Mobile-first (iPhone 15 ≈ 393×852). One column ≤560px, thumb-zone actions: bottom dock on the list, bottom action bar in detail. */
:root{
  color-scheme:dark;
  --bg:#07131f; --bg-2:#0b1c2c; --surface:#0f2336; --surface-2:#15304a; --line:#1f3d5a;
  --fg:#e7f0f7; --muted:#9db4c7; --accent:#ffa865; --accent-ink:#2b1404; --danger:#ff8a8a; --teal:#5fd4c6; --ok:#71e0aa;
  --seal:#a9bccb; --seal-dark:#7d93a6; --seal-belly:#dce6ed; --seal-ink:#15202b; --blush:#ff9fb2;
  --paper:#fbf8f1; --paper-ink:#2b2b2b;
  --sky-1:#050e19; --sky-2:#143250; --moon:#fff1c9; --star-op:1; --hill:#0c2134; --hill-2:#102a42;
  --sea-1:#1c4b6f; --sea-2:#133b5a; --beam:rgba(255,234,170,.16); --bubble:rgba(150,205,240,.45);
  --shadow:0 14px 32px -16px rgba(0,0,0,.7);
  --f-display:"LXGW WenKai TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"Fredoka","Noto Sans TC",system-ui,sans-serif;
  --r:22px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  --bar-h:58px; --dock-h:66px; --fz:1.17; --g:12px;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#eaf2f8; --bg-2:#dde9f2; --surface:#ffffff; --surface-2:#f1f6fa; --line:#cddcea;
  --fg:#0d2135; --muted:#4a6680; --accent:#d9601f; --accent-ink:#ffffff; --danger:#c9362f; --teal:#0f7f75; --ok:#17885a;
  --seal:#9fb3c4; --seal-dark:#73899d; --seal-belly:#e4ecf2; --seal-ink:#15202b; --blush:#ff8ea4;
  --sky-1:#8fcaef; --sky-2:#e6f4fc; --moon:#ffe08a; --star-op:0; --hill:#7eb39f; --hill-2:#5f9a85;
  --sea-1:#58aedb; --sea-2:#3a8dc0; --beam:rgba(255,255,255,0); --bubble:rgba(255,255,255,.7);
  --shadow:0 14px 30px -18px rgba(20,60,100,.45);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:calc(var(--bar-h) + var(--safe-t) + 12px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:calc(18px * var(--fz));line-height:1.65;overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;padding-bottom:calc(var(--dock-h) + var(--safe-b))}
button,input,label,a{font:inherit;color:inherit}
button,label.btn{cursor:pointer;-webkit-user-select:none;user-select:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:10px}
.wrap{width:100%;max-width:640px;margin:0 auto;padding-left:max(var(--g),var(--safe-l));padding-right:max(var(--g),var(--safe-r))}
.sr{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);pointer-events:none}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0;line-height:1.25}
p{margin:0}
svg{display:block}

/* ambient bubbles */
.bubbles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bubbles span{position:absolute;bottom:-40px;border-radius:50%;border:1.5px solid var(--bubble);animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh) translateX(20px)}}

/* top bar */
.top{position:sticky;top:0;z-index:30;padding-top:var(--safe-t);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;height:var(--bar-h)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:50px;height:36px;flex:none}
.brand b{font-family:var(--f-display);font-size:calc(21px * var(--fz));display:block;line-height:1.2;white-space:nowrap}
.brand small{display:block;color:var(--muted);font-size:calc(14px * var(--fz));line-height:1.3;white-space:nowrap}
.icon-btn{width:46px;height:46px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.icon-btn svg{width:22px;height:22px}
.icon-btn:disabled{opacity:.3;cursor:default}

/* hero */
.hero{position:relative;z-index:1}
.hero-art{position:relative;max-width:640px;margin:0 auto;height:clamp(130px,36vw,200px);overflow:hidden}
.hero-art svg{width:100%;height:100%}
.hero-copy{position:relative;margin-top:-10px;display:grid;gap:6px}
.eyebrow{font-family:var(--f-num);font-weight:600;letter-spacing:.1em;font-size:calc(15px * var(--fz));color:var(--teal)}
.hero h1{font-size:calc(clamp(34px,9.4vw,44px) * var(--fz))}
.hero h1 em{font-style:normal;color:var(--accent)}
.lede{color:var(--muted);font-size:calc(17px * var(--fz));line-height:1.75}

main{position:relative;z-index:1;padding-block:14px 20px}

/* now card */
.now{border-radius:22px;padding:14px 14px 14px;display:grid;gap:10px;box-shadow:var(--shadow);
  background:linear-gradient(165deg,color-mix(in srgb,var(--accent) 18%,var(--surface)),var(--surface) 70%);
  border:1.5px solid color-mix(in srgb,var(--accent) 55%,var(--line))}
.now-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.now-tag{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:calc(16px * var(--fz));color:var(--accent)}
.now-tag svg{width:18px;height:18px}
.dot{position:relative;width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none}
.dot::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--accent);animation:ping 1.8s ease-out infinite}
.now-clock{font-family:var(--f-num);font-weight:600;font-size:calc(18px * var(--fz));font-variant-numeric:tabular-nums;color:var(--muted)}
.now-hit{display:grid;gap:4px;text-align:left;background:none;border:0;padding:0}
.now h2{font-size:calc(28px * var(--fz))}
.now-sub{color:var(--muted);font-size:calc(17px * var(--fz))}
.now-time{display:flex;justify-content:space-between;gap:10px;font-size:calc(16px * var(--fz));color:var(--muted);font-variant-numeric:tabular-nums}
.now-time b{font-family:var(--f-num);font-weight:600;color:var(--fg)}
.now-bar{height:8px;border-radius:99px;background:color-mix(in srgb,var(--line) 80%,transparent);overflow:hidden}
.now-bar i{display:block;height:100%;border-radius:inherit;background:var(--accent)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.duo.one{grid-template-columns:1fr}

/* progress strip */
.prog{margin-top:10px;padding:10px 8px 6px;border-radius:20px;background:var(--surface);border:1px solid var(--line);display:grid;gap:10px}
.prog-head{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px}
.prog-head b{font-size:calc(17px * var(--fz))}
.prog-head span{font-family:var(--f-num);font-weight:600;font-size:calc(17px * var(--fz));color:var(--ok);font-variant-numeric:tabular-nums}
.dots{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.dots button{display:grid;justify-items:center;gap:2px;background:none;border:0;padding:2px 0;min-height:60px}
.dots i{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--f-num);font-weight:600;font-size:calc(17px * var(--fz));border:2px solid var(--line);color:var(--muted);background:var(--bg)}
.dots i svg{width:20px;height:20px}
.dots small{font-size:calc(14px * var(--fz));line-height:1.2;color:var(--muted);white-space:nowrap}
.dots .past i{opacity:.55}
.dots .cur i{border-color:var(--accent);color:var(--accent)}
.dots .cur small{color:var(--accent);font-weight:700}
.dots .done i{background:var(--ok);border-color:var(--ok);color:#06231a;opacity:1}

/* list */
.section-title{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;column-gap:10px;margin:20px 2px 10px}
.section-title h2{font-size:calc(28px * var(--fz))}
.section-title span{color:var(--muted);font-size:calc(15px * var(--fz))}
.stops{list-style:none;margin:0;padding:0}
.stop{scroll-margin-top:calc(var(--bar-h) + var(--safe-t) + 12px)}
.card{border-radius:var(--r);overflow:hidden;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.stop[data-status="now"] .card,.stop[data-status="next"] .card{border:2px solid color-mix(in srgb,var(--accent) 75%,var(--line))}
.stop[data-status="past"] .card-hit{opacity:.72}
.stop[data-status="past"] .thumb svg{filter:saturate(.45)}
.card-hit{display:block;width:100%;text-align:left;border:0;padding:0;background:none;transition:transform .15s ease}
.card-hit:active{transform:scale(.985)}
.thumb{position:relative;aspect-ratio:16/7;overflow:hidden;background:var(--surface-2)}
.thumb>svg{width:100%;height:100%}
.chip,.num-badge{position:absolute;top:12px;font-size:calc(15px * var(--fz));font-weight:700;padding:4px 12px;border-radius:999px;background:rgba(7,19,31,.74);color:#fff;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);line-height:1.5}
.chip{left:12px}
.num-badge{right:12px;font-family:var(--f-num);font-weight:600;letter-spacing:.04em}
.chip.now{background:var(--accent);color:var(--accent-ink)}
.chip.done{background:var(--ok);color:#06231a}
.mini-pola{position:absolute;right:12px;bottom:-8px;width:clamp(76px,24%,104px);padding:5px 5px 15px;background:var(--paper);border-radius:3px;transform:rotate(5deg);box-shadow:0 8px 18px rgba(0,0,0,.4)}
.mini-pola img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#ddd}
.card-body{padding:12px 14px 2px;display:grid;gap:4px}
.time{display:flex;align-items:center;gap:10px;font-size:calc(16px * var(--fz));color:var(--muted);font-variant-numeric:tabular-nums}
.time b{font-family:var(--f-num);font-weight:600;font-size:calc(18px * var(--fz));color:var(--teal)}
.time .go{margin-left:auto;color:var(--accent);font-weight:700}
.card h3{font-size:calc(25px * var(--fz))}
.place{display:flex;align-items:flex-start;gap:6px;color:var(--muted);font-size:calc(17px * var(--fz));line-height:1.5}
.place svg{width:20px;height:20px;flex:none;margin-top:2px;color:var(--teal)}
.sum{font-size:calc(17px * var(--fz))}
.card-actions{position:relative;padding:10px 14px 14px}
.hop{display:flex;align-items:center;gap:8px;margin-left:24px;padding:8px 0 8px 16px;border-left:2px dashed var(--line);color:var(--muted);font-size:calc(15px * var(--fz))}
.hop svg{width:18px;height:18px;color:var(--teal);flex:none}

/* finale */
.finale{margin-top:20px;scroll-margin-top:calc(var(--bar-h) + var(--safe-t) + 12px);border-radius:22px;padding:16px 14px;background:linear-gradient(160deg,var(--surface-2),var(--surface));border:1px solid var(--line);display:grid;gap:12px}
.finale-head{display:flex;align-items:center;gap:12px}
.finale-head svg{width:80px;height:58px;flex:none}
.finale h2{font-size:calc(28px * var(--fz))}
.finale p{color:var(--muted);font-size:calc(17px * var(--fz))}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.slot{aspect-ratio:4/5;border-radius:10px;border:2px dashed var(--line);display:grid;place-items:center;align-content:center;gap:2px;font-family:var(--f-num);font-weight:600;font-size:calc(24px * var(--fz));color:var(--muted);background:transparent;padding:0;overflow:hidden}
.slot small{font-family:var(--f-body);font-size:calc(14px * var(--fz));font-weight:500}
.slot.has{border:none;background:var(--paper);padding:4px 4px 14px;transform:rotate(var(--rot));box-shadow:0 6px 14px rgba(0,0,0,.35)}
.slot.has img{width:100%;height:100%;object-fit:cover;display:block;border-radius:2px;background:#ddd}
.trip-over{display:inline-flex;gap:6px;align-items:center;font-size:calc(16px * var(--fz));font-weight:700;color:var(--ok)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:10px 14px;border-radius:16px;border:1px solid var(--line);background:var(--surface-2);font-size:calc(18px * var(--fz));font-weight:700;line-height:1.3;text-align:center;text-decoration:none;color:var(--fg);transition:transform .12s ease}
.btn:active{transform:scale(.97)}
.btn svg{width:22px;height:22px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.ok{background:color-mix(in srgb,var(--ok) 16%,var(--surface));border-color:color-mix(in srgb,var(--ok) 55%,var(--line));color:var(--ok)}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btn-row{display:flex;flex-wrap:wrap;gap:10px}
.btn-row .btn{flex:1 1 140px}

/* bottom dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;padding-bottom:var(--safe-b);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.dock-in{max-width:640px;margin:0 auto;height:var(--dock-h);display:grid;grid-template-columns:repeat(3,1fr);padding-left:var(--safe-l);padding-right:var(--safe-r)}
.dock button{display:grid;justify-items:center;align-content:center;gap:3px;background:none;border:0;padding:0;font-size:calc(14px * var(--fz));font-weight:700;color:var(--muted)}
.dock svg{width:26px;height:26px}
.dock .mid span{width:52px;height:36px;border-radius:18px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink)}
.dock .mid svg{width:24px;height:24px}
.dock .mid{color:var(--fg)}

/* sheets */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{opacity:0;transform:translateY(32px)}to{opacity:1;transform:none}}
.sheet-bar{position:sticky;top:0;z-index:5;padding-top:var(--safe-t);background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.sheet-bar .wrap{display:flex;align-items:center;gap:12px;height:var(--bar-h)}
.sheet-bar b{font-family:var(--f-display);font-size:calc(21px * var(--fz));flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-bar .step{font-family:var(--f-num);font-weight:600;font-size:calc(17px * var(--fz));color:var(--muted);font-variant-numeric:tabular-nums}
.d-art{max-width:640px;margin:0 auto;aspect-ratio:2/1;max-height:30vh;max-height:30dvh;width:100%;overflow:hidden}
.d-art svg{width:100%;height:100%}
.d-body{display:grid;gap:18px;padding-top:14px;padding-bottom:calc(var(--dock-h) + var(--safe-b) + 36px)}
.d-head{display:grid;gap:6px}
.d-head h1{font-size:calc(clamp(30px,8.6vw,40px) * var(--fz))}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.fact{display:inline-flex;align-items:center;gap:6px;font-size:calc(16px * var(--fz));padding:6px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.fact svg{width:18px;height:18px;flex:none;color:var(--teal)}
.fact b{font-family:var(--f-num);font-weight:600;font-variant-numeric:tabular-nums}
.d-intro{font-size:calc(18px * var(--fz));line-height:1.9}
.say{display:flex;gap:12px;align-items:center}
.say svg{width:84px;height:60px;flex:none}
.say p{position:relative;background:var(--surface-2);border:1px solid var(--line);padding:12px 16px;border-radius:18px 18px 18px 4px;font-family:var(--f-display);font-size:calc(18px * var(--fz))}
.sect{display:grid;gap:8px}
.sect h2{font-size:calc(24px * var(--fz));display:flex;align-items:center;gap:10px}
.sect h2 svg{width:26px;height:26px;flex:none;color:var(--accent)}
.list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.list li{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:9px 14px;font-size:calc(17px * var(--fz))}
.list li::before{content:"";width:9px;height:9px;margin-top:11px;border-radius:50%;background:var(--teal);flex:none}
.list.food li::before{background:var(--accent)}
.list.tips li::before{border-radius:2px;background:var(--muted)}
.route{list-style:none;margin:0;padding:0;display:grid}
.route li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;padding-bottom:8px;position:relative;font-size:calc(17px * var(--fz))}
.route li::before{content:"";width:14px;height:14px;border-radius:50%;border:3px solid var(--teal);margin:7px 0 0 3px;background:var(--bg);z-index:1}
.route li:not(:last-child)::after{content:"";position:absolute;left:9px;top:22px;bottom:0;width:2px;background:var(--line)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pager button{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 16px;min-width:0;min-height:68px}
.pager button:last-child{text-align:right}
.pager small{display:block;color:var(--muted);font-size:calc(15px * var(--fz))}
.pager span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;font-size:calc(17px * var(--fz))}
.pager .ghost{visibility:hidden}
.swipe-hint{text-align:center;color:var(--muted);font-size:calc(15px * var(--fz))}

/* detail action bar (thumb zone) */
.d-actions{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:10px max(12px,var(--safe-r)) calc(10px + var(--safe-b)) max(12px,var(--safe-l));background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.d-actions .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:48px minmax(0,1fr) minmax(0,1fr) 48px;gap:6px;align-items:center}
.d-actions .icon-btn{width:48px;height:54px;border-radius:16px}
.d-actions .btn,.duo .btn{white-space:nowrap;padding-inline:10px}
.d-actions .btn{width:100%}
.d-actions .btn svg{display:none}
@media (min-width:380px){.d-actions .btn svg{display:block}}
.d-check{display:contents}

/* check-in */
.checkin{scroll-margin-top:calc(var(--bar-h) + var(--safe-t) + 12px);border-radius:22px;padding:14px;background:linear-gradient(170deg,color-mix(in srgb,var(--accent) 14%,var(--surface)),var(--surface));border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));display:grid;gap:14px}
.checkin h2{font-size:calc(25px * var(--fz))}
.checkin>p{color:var(--muted);font-size:calc(17px * var(--fz))}
.drop{display:grid;place-items:center;gap:6px;text-align:center;padding:16px 12px;min-height:170px;border:2px dashed color-mix(in srgb,var(--accent) 55%,var(--line));border-radius:20px;cursor:pointer;transition:background .2s}
.drop:active,.drop.over{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.drop svg{width:120px;height:86px}
.drop b{font-size:calc(21px * var(--fz))}
.drop span{color:var(--muted);font-size:calc(16px * var(--fz))}
.drop.busy{pointer-events:none;opacity:.7}
.pola-wrap{display:grid;place-items:center;padding:10px 0 4px}

/* ---------- seal ---------- */
const SEAL = {
  tail:"M18 74 C10 66 4 62 0 64 C4 70 6 76 4 84 C10 82 16 80 20 80Z",
  body:"M14 76 C22 52 58 38 90 40 C116 42 134 58 130 76 C127 90 104 95 72 93 C42 92 16 90 14 76Z",
  belly:"M46 90 C66 84 100 84 126 80 C120 91 100 95 74 94 C60 93 52 92 46 90Z",
  flip:"M80 82 C76 92 68 97 58 96 C66 92 70 86 72 80Z",
  mouth:"M103 57 q4 3.5 8 0",
  whisk:"M97 55 L84 53M97 58 L85 60M117 55 L130 53M117 58 L129 60"
};
function sealInner(opts = {}){
  const eyes = opts.sleepy
    ? `<path d="M92 43 q5 4 10 0M112 43 q5 4 10 0" stroke="var(--seal-ink)" stroke-width="2" fill="none" stroke-linecap="round"/>`
    : `<g class="blink"><circle cx="97" cy="42" r="4.6" fill="var(--seal-ink)"/><circle cx="117" cy="42" r="4.6" fill="var(--seal-ink)"/><circle cx="98.6" cy="40.4" r="1.6" fill="#fff"/><circle cx="118.6" cy="40.4" r="1.6" fill="#fff"/></g>`;
  /* raised "hi" flipper: drawn in front of the chest, light fill + outline so it never reads as a shadow; pivots at (119,80) */
  const waveFlip = opts.wave
    ? `<g><path d="M113 81 C116 70 120 60 126 51 C129 46.5 135 47.5 134 53 C133 63 129 74 125 83 Z" fill="var(--seal)" stroke="var(--seal-dark)" stroke-width="1.6" stroke-linejoin="round"/><path d="M125 56 l3 -2M126 60 l3 -1" stroke="var(--seal-dark)" stroke-width="1.2" stroke-linecap="round" opacity=".6"/>${RM ? "" : `<animateTransform attributeName="transform" type="rotate" values="-16 119 80;6 119 80;-16 119 80" keyTimes="0;.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" dur="1.3s" repeatCount="indefinite"/>`}</g>`
    : "";
  return `<path d="${SEAL.tail}" fill="var(--seal-dark)"/>
    <path d="${SEAL.body}" fill="var(--seal)"/>
    <path d="${SEAL.belly}" fill="var(--seal-belly)" opacity=".85"/>
    <circle cx="50" cy="60" r="3" fill="var(--seal-dark)" opacity=".45"/><circle cx="62" cy="53" r="2.2" fill="var(--seal-dark)" opacity=".45"/><circle cx="40" cy="68" r="2.4" fill="var(--seal-dark)" opacity=".45"/>
    <circle cx="106" cy="46" r="27" fill="var(--seal)"/>
    <path d="${SEAL.flip}" fill="var(--seal-dark)"/>
    ${eyes}
    <ellipse cx="107" cy="55" rx="10" ry="7" fill="var(--seal-belly)"/>
    <ellipse cx="107" cy="51.5" rx="3.6" ry="2.6" fill="var(--seal-ink)"/>
    <path d="${SEAL.mouth}" stroke="var(--seal-ink)" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <circle cx="90" cy="53" r="4" fill="var(--blush)" opacity=".55"/><circle cx="124" cy="53" r="4" fill="var(--blush)" opacity=".55"/>
    <path d="${SEAL.whisk}" stroke="var(--seal-ink)" stroke-width=".9" opacity=".5" stroke-linecap="round"/>
    ${waveFlip}`;
}
/* gentle rock + float, pivot fixed in local units so changing bbox (waving flipper) can't make it jitter */
const RM = (() => { try { return matchMedia("(prefers-reduced-motion: reduce)").matches; } catch { return false; } })();
function bobAnim(cx = 68, cy = 94, delay = 0, amp = 4, deg = 2.5, dur = 3.4){
  if (RM) return "";
  const sp = `calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1" dur="${dur}s" begin="${-delay}s" repeatCount="indefinite"`;
  return `<animateTransform attributeName="transform" type="rotate" values="${-deg} ${cx} ${cy};${deg} ${cx} ${cy};${-deg} ${cx} ${cy}" ${sp}/>`
       + `<animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 ${-amp};0 0" ${sp}/>`;
}
const sealSVG = (opts = {}) => `<svg viewBox="-2 14 142 86" aria-hidden="true"><g>${sealInner(opts)}${opts.bob ? bobAnim() : ""}</g></svg>`;
const sealAt = (x, y, s, opts = {}) => `<g transform="translate(${x} ${y}) scale(${s})"><g>${sealInner(opts)}${opts.bob ? bobAnim() : ""}</g></g>`;

/* ---------- scene parts ---------- */
const grad = (id, stops) => `<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">${stops.map((c,i)=>`<stop offset="${i/(stops.length-1)}" stop-color="${c}"/>`).join("")}</linearGradient>`;
function wave(y, amp, fill, dur = 8, op = 1){
  let d = `M0 ${y}`; for (let x = 0; x < 800; x += 100) d += ` q25 ${-amp} 50 0 t50 0`;
  return `<path class="wv" style="animation-duration:${dur}s" d="${d} V260 H0Z" fill="${fill}" opacity="${op}"/>`;
}
const stars = (n, h, seed = 1) => { let s = seed, out = ""; const r = () => (s = (s*9301+49297)%233280)/233280;
  for (let i=0;i<n;i++) out += `<circle class="tw" style="animation-delay:${(r()*3).toFixed(2)}s" cx="${(r()*400).toFixed(1)}" cy="${(r()*h).toFixed(1)}" r="${(r()*1.2+.4).toFixed(2)}" fill="#fff"/>`;
  return out; };
const cloud = (x,y,s,fill="#fff",op=.9) => `<g transform="translate(${x} ${y}) scale(${s})" fill="${fill}" opacity="${op}"><ellipse cx="0" cy="0" rx="30" ry="9"/><ellipse cx="14" cy="-7" rx="16" ry="10"/><ellipse cx="-10" cy="-4" rx="12" ry="7"/></g>`;
const boat = (x,y,c,delay=0) => `<g transform="translate(${x} ${y})"><g class="bob" style="animation-delay:${delay}s"><path d="M0 0 h50 l-9 13 h-32Z" fill="${c}"/><rect x="12" y="-12" width="19" height="12" fill="#f3f3f3"/><rect x="16" y="-9" width="5" height="5" fill="#7cc5ef"/><rect x="24" y="-9" width="5" height="5" fill="#7cc5ef"/><path d="M36 -1 v-22" stroke="#555" stroke-width="1.5"/><path d="M36 -23 l11 6 h-11Z" fill="#ff5a5a"/></g></g>`;
const svgWrap = (inner, vb = "0 0 400 240", label = "") => `<svg viewBox="${vb}" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${esc(label)}">${inner}</svg>`;

const SCENES = {
  train(u){
    let win = ""; for (let i=0;i<5;i++) win += `<rect x="${12+i*36}" y="133" width="26" height="14" rx="3" fill="#d6ecff"/>`;
    return `<defs>${grad(u+"sk",["#8cc6ee","#cfe8f7","#ffe3c6"])}${grad(u+"se",["#3f9bd0","#1d5e8e"])}</defs>
    <rect width="400" height="240" fill="url(#${u}sk)"/>
    <circle class="glow" cx="322" cy="58" r="34" fill="#fff6d5" opacity=".5"/><circle cx="322" cy="58" r="20" fill="#fff1b8"/>
    <g class="drift">${cloud(80,48,1.1)}${cloud(220,72,.8)}${cloud(370,36,.7)}</g>
    <path d="M0 140 C60 108 120 126 170 114 C230 100 300 132 400 108 V180 H0Z" fill="#79b394"/>
    <path d="M0 158 C70 136 150 152 220 140 C290 130 340 150 400 140 V180 H0Z" fill="#4f8f70"/>
    <rect y="176" width="400" height="64" fill="url(#${u}se)"/>
    ${wave(184,3,"#62b4df",7,.7)}${wave(204,4,"#2f7fb3",10,.85)}
    <rect y="166" width="400" height="5" fill="#5a4a42"/>
    <g class="run">
      <rect x="0" y="126" width="190" height="38" rx="12" fill="#2f6fb3"/>
      <path d="M186 126 h16 q20 0 24 20 v18 h-40Z" fill="#285f9b"/>
      <rect x="0" y="152" width="226" height="5" fill="#ffcf5a"/>${win}
      <path d="M196 132 h7 q12 0 16 13 h-23Z" fill="#d6ecff"/>
      <circle cx="97" cy="142" r="6.5" fill="var(--seal)"/><circle cx="94.6" cy="140.6" r="1.2" fill="#15202b"/><circle cx="99.4" cy="140.6" r="1.2" fill="#15202b"/><ellipse cx="97" cy="143.8" rx="1.5" ry="1" fill="#15202b"/>
      <g fill="#2a2f36"><circle cx="30" cy="166" r="5"/><circle cx="62" cy="166" r="5"/><circle cx="140" cy="166" r="5"/><circle cx="172" cy="166" r="5"/><circle cx="208" cy="166" r="5"/></g>
    </g>`;
  },
  houses(u){
    const H = [[62,"#f26b5b"],[54,"#ffc94d"],[70,"#5bb8e8"],[58,"#8fd16a"],[66,"#f59ac0"],[50,"#7d8cf0"],[72,"#ffa24d"],[60,"#4fd1b5"]];
    const row = H.map(([h,c],i) => { const x = 6+i*49, y = 140-h; let w = "";
      for (let r=0; r<Math.floor((h-14)/20); r++) w += `<rect x="${x+9}" y="${y+12+r*20}" width="9" height="10" fill="#fff8e6"/><rect x="${x+28}" y="${y+12+r*20}" width="9" height="10" fill="#fff8e6"/>`;

    <g class="drift">${cloud(70,30,1)}${cloud(300,44,.9)}</g>
    <path d="M0 92 C60 70 120 84 180 74 C250 62 320 86 400 70 V140 H0Z" fill="#79ad97"/>
    ${row}
    <rect y="138" width="400" height="5" fill="#5b4a3e"/>
    <rect y="142" width="400" height="100" fill="url(#${u}se)"/>
    <g clip-path="url(#${u}cl)"><g class="rip"><g transform="translate(0 286) scale(1 -1)" opacity=".38">${row}</g></g></g>
    <g class="drift" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".45"><path d="M30 170 h40M150 186 h60M280 168 h36M90 210 h50M250 220 h70"/></g>
    ${boat(60,182,"#e94f4f",0)}${boat(250,196,"#2f6fb3",1.2)}
    ${wave(226,3,"#0f4a72",9,.9)}`;
  },
  rocks(u){
    let tofu = ""; for (let x=240;x<400;x+=22) tofu += `<path d="M${x} 196 L${x-8} 240"/>`; tofu += `<path d="M228 212 H400M222 226 H400"/>`;
    return `<defs>${grad(u+"sk",["#6fc0ee","#d6f0ff"])}${grad(u+"se",["#27a1c8","#0d6690"])}</defs>
    <rect width="400" height="240" fill="url(#${u}sk)"/>
    <circle class="glow" cx="70" cy="44" r="30" fill="#fff8d6" opacity=".55"/><circle cx="70" cy="44" r="17" fill="#fff4bf"/>
    <g class="gull"><g transform="translate(0 60)"><path class="flap" d="M0 0 q6 -6 12 0 q6 -6 12 0" stroke="#33414d" stroke-width="2" fill="none"/></g><g transform="translate(-30 78) scale(.7)"><path class="flap" style="animation-delay:.2s" d="M0 0 q6 -6 12 0 q6 -6 12 0" stroke="#33414d" stroke-width="2" fill="none"/></g></g>
    <rect y="120" width="400" height="120" fill="url(#${u}se)"/>
    <path d="M272 122 C286 102 300 94 314 104 C322 110 330 117 342 122Z" fill="#5f87a0"/>
    ${wave(128,2,"#5bc0e0",9,.6)}${wave(150,3,"#1f8ab5",11,.7)}
    <path d="M0 240 V168 C18 150 50 146 70 158 C90 148 112 164 120 184 C134 190 142 214 152 240Z" fill="#9c7a58"/>
    <path d="M0 240 V196 C30 186 70 190 100 204 C120 214 130 226 136 240Z" fill="#7e5f43"/>
    <g transform="translate(176 0)"><rect x="10" y="176" width="12" height="40" rx="5" fill="#8a6a4b"/><ellipse cx="16" cy="172" rx="26" ry="14" fill="#a8835e"/><ellipse cx="16" cy="168" rx="22" ry="8" fill="#b9946c"/></g>

    <g class="foam" fill="#fff"><ellipse cx="160" cy="226" rx="22" ry="4"/><ellipse cx="214" cy="220" rx="14" ry="3"/><ellipse cx="128" cy="200" rx="10" ry="3"/></g>
    ${sealAt(18,112,.55,{bob:true})}`;
  },
  tower(u){
    let city = "", lit = ""; const B = [[0,26,40],[42,36,30],[74,22,46],[226,30,38],[262,40,28],[300,24,44],[330,34,34],[370,30,40]];
    B.forEach(([x,w,h],i) => { city += `<rect x="${x}" y="${206-h}" width="${w}" height="${h}" fill="#2a2650"/>`;
      for (let k=0;k<3;k++) lit += `<rect class="tw" style="animation-delay:${((i*3+k)%7)*.4}s" x="${x+4+k*8}" y="${206-h+8+(k%2)*10}" width="4" height="5" fill="#ffd77a"/>`; });
    let lattice = ""; for (let y=70;y<196;y+=14) lattice += `<path d="M168 ${y} L184 ${y+14}M184 ${y} L168 ${y+14}"/>`;
    return `<defs>${grad(u+"sk",["#4f4c9c","#e9837a","#ffd28a"])}${grad(u+"se",["#40508a","#232c5a"])}</defs>
    <rect width="400" height="240" fill="url(#${u}sk)"/>
    <g class="drift">${cloud(90,40,1,"#ffc2b6",.8)}${cloud(320,30,.8,"#ffd1c4",.7)}</g>
    <circle class="glow" cx="300" cy="150" r="40" fill="#ffe6a6" opacity=".45"/><circle cx="300" cy="150" r="26" fill="#ffe9ac"/>
    <path d="M0 160 C50 132 110 142 160 136 C220 128 280 150 330 140 C360 134 380 140 400 136 V210 H0Z" fill="#5a4a85"/>
    <path d="M0 240 V112 C30 102 80 106 122 122 L132 240Z" fill="#3a3362"/>
    <rect x="168" y="62" width="16" height="148" fill="#e8edf5"/>
    <g stroke="#9aa6c4" stroke-width="1">${lattice}</g>
    <rect x="148" y="50" width="56" height="16" rx="4" fill="#f4f6fb"/><rect x="152" y="54" width="48" height="6" fill="#8fc6ee"/>
    <path d="M150 60 L116 112" stroke="#e8edf5" stroke-width="5"/>
    <circle class="blinkred" cx="176" cy="44" r="3" fill="#ff4d4d"/><path d="M176 50 V46" stroke="#e8edf5" stroke-width="2"/>
    ${city}${lit}
    <rect y="206" width="400" height="34" fill="url(#${u}se)"/>
    <g stroke="#ffd98a" stroke-width="2" opacity=".6" class="drift"><path d="M286 214 h28M292 222 h16M296 230 h10"/></g>
    <g class="sail"><g transform="translate(200 196)"><path d="M0 10 h70 l-8 10 h-56Z" fill="#f5f7fb"/><rect x="10" y="2" width="44" height="8" fill="#f5f7fb"/><rect x="14" y="4" width="36" height="3" fill="#6f87b8"/><rect x="40" y="-6" width="6" height="8" fill="#e85d5d"/></g></g>
    ${wave(228,2,"#1d2550",10,.8)}`;
  },
  market(u){
    let lan = ""; [40,95,150,205,260,315,365].forEach((x,i) => { const y = 62 + Math.sin(i/6*Math.PI)*18;
      lan += `<g transform="translate(${x} ${y})"><g class="swing" style="animation-delay:${i*.3}s"><path d="M0 0 v6" stroke="#ffcf5a" stroke-width="1.5"/><circle cx="0" cy="20" r="20" fill="#ffd25a" opacity=".22"/><ellipse cx="0" cy="20" rx="10" ry="13" fill="#ffc83d"/><rect x="-6" y="5" width="12" height="3" rx="1" fill="#c6461f"/><rect x="-6" y="32" width="12" height="3" rx="1" fill="#c6461f"/><path d="M-4 12 v16M0 9 v22M4 12 v16" stroke="#e8a21d" stroke-width="1"/></g></g>`; });
    const stall = (x,label) => { let st = ""; for (let i=0;i<6;i++) st += `<rect x="${x+i*18}" y="150" width="18" height="16" fill="${i%2?"#fff3d6":"#e94b3c"}"/>`;
      return `${st}<path d="M${x} 166 ${Array.from({length:6},(_,i)=>`q9 8 18 0`).join(" ")}" fill="#e94b3c"/>
        <rect x="${x+6}" y="128" width="96" height="20" rx="4" fill="#ffe7a3"/><text x="${x+54}" y="142.5" text-anchor="middle" font-size="11" font-weight="700" fill="#7a2a12" font-family="Noto Sans TC, sans-serif">${label}</text>
        <rect x="${x}" y="186" width="108" height="54" fill="#5a2e2e"/><rect x="${x}" y="182" width="108" height="6" fill="#7b3e3a"/>`; };
    return `<defs>${grad(u+"sk",["#140f30","#3b1f4f","#5a2a4a"])}</defs>
    <rect width="400" height="240" fill="url(#${u}sk)"/>${stars(26,90,7)}
    <path d="M40 124 Q120 92 200 98 Q280 92 360 124 L340 124 Q280 110 200 112 Q120 110 60 124Z" fill="#1d1226"/>
    <rect x="70" y="122" width="260" height="60" fill="#22152b"/>
    <path d="M196 98 l4 -10 l4 10Z" fill="#1d1226"/>
    <path d="M0 58 Q200 98 400 58" stroke="#3b2a3e" stroke-width="1.5" fill="none"/>${lan}
    ${stall(14,"營養三明治")}${stall(146,"鼎邊趖")}${stall(278,"泡泡冰")}
    <g transform="translate(200 184)"><path d="M-14 0 h28 q-2 12 -14 12 q-12 0 -14 -12Z" fill="#f5f0e6"/>
      <path class="steam" d="M-6 -2 q-4 -6 0 -12 q4 -6 0 -12" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path class="steam" style="animation-delay:.9s" d="M2 -2 q-4 -6 0 -12 q4 -6 0 -12" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path class="steam" style="animation-delay:1.7s" d="M9 -2 q-4 -6 0 -12 q4 -6 0 -12" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></g>
    ${sealAt(300,150,.42,{bob:true,wave:true})}
    <rect y="232" width="400" height="8" fill="#140c22"/>`;
  },
  home(u){
    let win = ""; for (let i=0;i<5;i++) win += `<rect x="${12+i*36}" y="133" width="26" height="14" rx="3" fill="#ffe08a"/>`;
    let lights = ""; for (let x=10;x<400;x+=26) lights += `<circle class="tw" style="animation-delay:${(x%7)*.3}s" cx="${x}" cy="176" r="2" fill="#ffd27a"/><rect x="${x-1}" y="184" width="2" height="${10+(x%3)*6}" fill="#ffd27a" opacity=".35"/>`;
    return `<defs>${grad(u+"sk",["#0a1530","#1c2e5a"])}</defs>
    <rect width="400" height="240" fill="url(#${u}sk)"/>${stars(40,120,3)}
    <circle class="glow" cx="320" cy="48" r="30" fill="#fff4cc" opacity=".25"/><circle cx="320" cy="48" r="17" fill="#fff4cc"/><circle cx="328" cy="42" r="15" fill="#132350"/>
    <path d="M0 150 C70 122 150 140 220 128 C290 116 340 140 400 126 V180 H0Z" fill="#132447"/>
    <rect y="178" width="400" height="62" fill="#0d1c3a"/>${lights}
    ${wave(214,3,"#0a1730",10,.9)}
    <rect y="166" width="400" height="5" fill="#2a2c3e"/>
    <g class="runback">
      <rect x="0" y="126" width="190" height="38" rx="12" fill="#3a4a7a"/>
      <path d="M0 126 h-4 q-20 0 -24 20 v18 h28Z" fill="#33426e"/>

      <text class="zz" x="104" y="128" font-size="10" font-weight="700" fill="#cfe2ff" font-family="Fredoka, sans-serif">z</text>
      <text class="zz" style="animation-delay:1.2s" x="108" y="124" font-size="8" font-weight="700" fill="#cfe2ff" font-family="Fredoka, sans-serif">z</text>

    </g>`;
  }
};
const scene = (stop) => svgWrap(SCENES[stop.scene](uid()), "0 0 400 240", stop.place + " 插圖");

function heroSVG(){
  const u = uid();
  let bubbles = ""; [[250,198,4,0],[262,206,2.6,1.5],[120,210,3,3],[330,214,3.4,2.2]].forEach(([x,y,r,d]) =>
    bubbles += `<circle class="bub" style="animation-delay:${d}s" cx="${x}" cy="${y}" r="${r}" fill="none" stroke="var(--bubble)" stroke-width="1.2"/>`);
  return `<svg viewBox="0 0 400 230" preserveAspectRatio="xMidYMax slice" role="img" aria-label="海豹坐在港口浮標上，背景是燈塔與夜空">
    <defs><linearGradient id="${u}sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--sky-1)"/><stop offset="1" style="stop-color:var(--sky-2)"/></linearGradient></defs>
    <rect width="400" height="230" fill="url(#${u}sk)"/>
    <g style="opacity:var(--star-op)">${stars(36,120,11)}</g>
    <circle class="glow" cx="322" cy="52" r="34" style="fill:var(--moon)" opacity=".22"/><circle cx="322" cy="52" r="18" style="fill:var(--moon)"/>
    <path d="M0 138 C40 112 90 118 130 126 C170 108 220 104 260 120 C300 110 350 116 400 108 V170 H0Z" style="fill:var(--hill-2)"/>
    <path d="M150 140 v-26 h4 v26M150 114 h26 v3 h-26M200 140 v-20 h3 v20M200 120 h20 v3 h-20" style="stroke:var(--hill)" stroke-width="2.5" fill="none"/>
    <path d="M0 150 C40 134 90 138 140 146 C200 138 260 140 400 136 V180 H0Z" style="fill:var(--hill)"/>
    <g class="beam"><path d="M62 92 L-60 70 L-60 116Z" style="fill:var(--beam)"/></g>
    <path d="M30 156 C40 140 80 138 92 156Z" style="fill:var(--hill)"/>
    <path d="M54 142 L57 98 H67 L70 142Z" fill="#f2f2ee"/><path d="M55.6 128 H68.4 L68 120 H56Z M56.4 112 H67.6 L67.2 104 H56.8Z" fill="#e2524a"/>

/* ---------- check-in storage (IndexedDB in this browser) ---------- */
const checkins = {};   // id -> {blob, url, note, at}
let dbP = null;
function db(){
  if (!dbP) dbP = new Promise((res, rej) => {
    try { const r = indexedDB.open("seal-keelung", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("checkins");
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    } catch (e) { rej(e); }
  });
  return dbP;
}
async function dbAll(){
  try { const d = await db(); return await new Promise((res, rej) => {
    const out = {}, tx = d.transaction("checkins"), st = tx.objectStore("checkins"), cur = st.openCursor();
    cur.onsuccess = () => { const c = cur.result; if (c) { out[c.key] = c.value; c.continue(); } else res(out); };
    cur.onerror = () => rej(cur.error); });
  } catch { return {}; }
}
async function dbPut(key, val){ try { const d = await db(); d.transaction("checkins","readwrite").objectStore("checkins").put(val, key); return true; } catch { return false; } }
async function dbDel(key){ try { const d = await db(); d.transaction("checkins","readwrite").objectStore("checkins").delete(key); } catch {} }

function loadImg(src){ return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("decode")); i.src = src; }); }
async function processPhoto(file){
  if (!file || !/^image\//.test(file.type || "image/")) throw new Error("請選擇照片檔（JPG、PNG 或 WebP）");
  const url = URL.createObjectURL(file);
  try {
    const img = await loadImg(url).catch(() => { throw new Error("這張照片的格式無法讀取，請改用 JPG 或 PNG"); });
    const max = 1600, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth*k); c.height = Math.round(img.naturalHeight*k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", .9));
    if (!blob) throw new Error("照片處理失敗，請再試一次");
    return blob;
  } finally { URL.revokeObjectURL(url); }
}
function setCheckin(id, rec){
  if (checkins[id]?.url) URL.revokeObjectURL(checkins[id].url);
  if (!rec) { delete checkins[id]; return; }
  checkins[id] = { ...rec, url: URL.createObjectURL(rec.blob) };
}
function guardImages(root){
  root.querySelectorAll("img[data-photo]").forEach(img => img.addEventListener("error", () => {
    const f = img.closest(".pola"); if (f) f.classList.add("broken"); else img.style.visibility = "hidden";
  }, { once:true }));
}

/* ---------- status by clock ---------- */
let statusMap = {};
const nowMins = () => { const d = new Date(); return d.getHours()*60 + d.getMinutes(); };
function computeStatus(){
  const t = nowMins();
  let flagged = false; statusMap = {};
  STOPS.forEach(s => {
    const a = mins(s.start), b = mins(s.end);
    if (t > b) statusMap[s.id] = "past";
    else if (t >= a) { statusMap[s.id] = flagged ? "future" : "now"; flagged = true; }
    else { statusMap[s.id] = flagged ? "future" : "next"; flagged = true; }
  });
  return t;
}
const tripOver = () => STOPS.every(s => statusMap[s.id] === "past");
const doneCount = () => STOPS.filter(s => checkins[s.id]).length;
const currentStop = () => STOPS.find(s => ["now","next"].includes(statusMap[s.id]));
const fmtDur = m => m >= 60 ? `${Math.floor(m/60)} 小時${m%60 ? ` ${m%60} 分` : ""}` : `${m} 分鐘`;
const navUrl = s => `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(s.map)}`;
const navBtn = (s, label = "導航") => `<a class="btn" href="${navUrl(s)}" target="_blank" rel="noopener noreferrer">${ICON.nav} ${label}</a>`;
/* check-in button: opens the camera / photo picker straight from the list (label → hidden input in that card) */
function checkBtn(s){
  return checkins[s.id]
    ? `<button class="btn ok" type="button" data-open="${s.id}" data-focus="ci">${ICON.check} 已打卡</button>`
    : `<label class="btn primary" for="lf-${s.id}">${ICON.cam} 打卡拍照</label>`;
}

/* ---------- render: now card + progress ---------- */
function renderNow(){
  const d = new Date(), t = d.getHours()*60 + d.getMinutes(), clock = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const cur = currentStop(), el = $("#now");
  if (!cur) {
    el.innerHTML = `
      <div class="now-top"><span class="now-tag">${ICON.star} 行程走完了</span><span class="now-clock">${clock}</span></div>
      <h2>辛苦了，回家路上做拼貼吧</h2>
      <p class="now-sub">今天打卡 ${doneCount()} / 6 站</p>
      <div class="duo one"><button class="btn primary" type="button" data-dock="collage">${ICON.cam} 製作旅程拼貼</button></div>`;
    return;
  }
  const i = STOPS.indexOf(cur), a = mins(cur.start), b = mins(cur.end), live = statusMap[cur.id] === "now";
  const pct = live ? Math.max(2, Math.min(100, Math.round((t - a) / (b - a) * 100))) : 0;
  el.innerHTML = `
    <div class="now-top"><span class="now-tag"><i class="dot"></i>${live ? "進行中" : "下一站"} · 第 ${i+1} 站</span><span class="now-clock">${clock}</span></div>
    <button class="now-hit" type="button" data-open="${cur.id}" aria-label="${esc(cur.title)}，看完整介紹">
      <h2>${esc(cur.title)}</h2>
      <span class="place">${ICON.pin}<span>${esc(cur.place)}</span></span>
    </button>
    <div class="now-time"><b>${cur.start} – ${cur.end}</b><span>${live ? `還有 ${fmtDur(b - t)}` : `${fmtDur(a - t)}後出發`}</span></div>
    ${live ? `<div class="now-bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>` : ""}
    <div class="duo">${navBtn(cur)}${checkBtn(cur)}</div>`;
}
function renderProg(){
  const n = doneCount(), cur = currentStop();
  $("#prog").innerHTML = `
    <div class="prog-head"><b>打卡進度</b><span>${n} / 6</span></div>
    <div class="dots">${STOPS.map((s, i) => {
      const cls = checkins[s.id] ? "done" : cur && cur.id === s.id ? "cur" : statusMap[s.id] === "past" ? "past" : "";
      return `<button type="button" class="${cls}" data-jump="${s.id}" aria-label="第 ${i+1} 站 ${esc(s.short)}${checkins[s.id] ? "，已打卡" : ""}"><i>${checkins[s.id] ? ICON.check : i+1}</i><small>${esc(s.short)}</small></button>`;
    }).join("")}</div>`;
}

/* ---------- render: list ---------- */
function chipFor(s){
  if (checkins[s.id]) return `<span class="chip done">已打卡</span>`;
  const st = statusMap[s.id];
  if (st === "now") return `<span class="chip now">進行中</span>`;
  if (st === "next") return `<span class="chip now">下一站</span>`;
  if (st === "past") return `<span class="chip">已結束</span>`;

function renderFinale(){

function renderAll(){ computeStatus(); renderNow(); renderProg(); renderList(); renderFinale(); }

/* ---------- sheets + history (iOS edge-swipe / Android back closes the sheet instead of leaving the page) ---------- */
const lockBody = () => { document.body.style.overflow = $("#detail").hidden && $("#collage").hidden ? "" : "hidden"; };
let openId = null;
function openDetail(id, mode = "push"){

  const s = STOPS[i], prev = STOPS[i-1], next = STOPS[i+1], el = $("#detail"), wasOpen = !el.hidden;

  el.innerHTML = `
    <div class="sheet-bar"><div class="wrap">

      ${s.highlights ? `<div class="sect"><h2>${ICON.star}必看亮點</h2>${list(s.highlights)}</div>` : ""}
      ${s.food ? `<div class="sect"><h2>${ICON.bowl}吃什麼</h2>${list(s.food,"food")}</div>` : ""}

        <button type="button" class="${next ? "" : "ghost"}" ${next ? `data-open="${next.id}"` : "tabindex=\"-1\" aria-hidden=\"true\""}><small>下一站 →</small><span>${esc(next?.place || "")}</span></button>

    </div></div>`;
  renderCheckin(s, false);
  el.hidden = false; el.scrollTop = 0; lockBody();

    if (mode === "push" && !wasOpen) history.pushState({ sheet:id }, "", "#" + id);
    else if (mode !== "none") history.replaceState({ sheet:id }, "", "#" + id);
  } catch {}
  el.querySelector("[data-close]").focus({ preventScroll:true });
}
function hideDetail(){
  const id = openId;
  $("#detail").hidden = true; $("#detail").innerHTML = ""; openId = null; lockBody();
  renderAll();
  const card = id && document.getElementById("card-" + id); if (card) card.scrollIntoView({ block:"center" });
}
function closeDetail(){
  if (history.state && history.state.sheet) { history.back(); return; }
  hideDetail();
  try { history.replaceState(null, "", location.pathname + location.search); } catch {}
}
function hideCollage(){ $("#collage").hidden = true; lockBody(); }
function closeCollage(){
  if (history.state && history.state.collage) { history.back(); return; }
  hideCollage();
}
window.addEventListener("popstate", () => {
  const h = (location.hash || "").slice(1);
  if (!$("#collage").hidden && !(history.state && history.state.collage)) hideCollage();
  if (STOPS.some(s => s.id === h)) { if (openId !== h) openDetail(h, "none"); }

});

  else { [[97,42],[117,42]].forEach(([a,b]) => { ctx.beginPath(); ctx.arc(a,b,4.6,0,7); ctx.fill(); });
    ctx.fillStyle = "#fff"; [[98.6,40.4],[118.6,40.4]].forEach(([a,b]) => { ctx.beginPath(); ctx.arc(a,b,1.6,0,7); ctx.fill(); }); }

  ctx.fillStyle = "#15202b"; ctx.beginPath(); ctx.ellipse(107,51.5,3.6,2.6,0,0,7); ctx.fill();
  ctx.strokeStyle = "#15202b"; ctx.lineWidth = 1.4; ctx.lineCap = "round"; ctx.stroke(P(SEAL.mouth));
  ctx.fillStyle = "rgba(255,159,178,.55)"; [[90,53],[124,53]].forEach(([a,b]) => { ctx.beginPath(); ctx.arc(a,b,4,0,7); ctx.fill(); });
  ctx.globalAlpha = .5; ctx.lineWidth = .9; ctx.stroke(P(SEAL.whisk));

}
function drawBg(ctx){
  const g = ctx.createLinearGradient(0,0,0,CH); g.addColorStop(0,"#0d2b44"); g.addColorStop(.6,"#0a1f33"); g.addColorStop(1,"#06131f");
  ctx.fillStyle = g; ctx.fillRect(0,0,CW,CH);

  ctx.fillStyle = "rgba(255,255,255,.8)";
  for (let i=0;i<60;i++){ ctx.globalAlpha = r()*.7+.2; ctx.beginPath(); ctx.arc(r()*CW, r()*260, r()*2+.6, 0, 7); ctx.fill(); }
  ctx.globalAlpha = 1; ctx.strokeStyle = "rgba(150,205,240,.35)"; ctx.lineWidth = 2;
  for (let i=0;i<14;i++){ ctx.beginPath(); ctx.arc(r()*CW, 300+r()*900, r()*10+4, 0, 7); ctx.stroke(); }
  const waveFill = (y, amp, col) => { ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0,y);
    for (let x=0; x<=CW; x+=10) ctx.lineTo(x, y + Math.sin(x/70)*amp); ctx.lineTo(CW,CH); ctx.lineTo(0,CH); ctx.fill(); };
  waveFill(1210,10,"#123a5a"); waveFill(1240,8,"#0c2c47");

function drawRoute(ctx, active){

function cover(ctx, img, x, y, w, h){

function fitText(ctx, text, maxW){ if (ctx.measureText(text).width <= maxW) return text; let t = text; while (t.length && ctx.measureText(t + "…").width > maxW) t = t.slice(0,-1); return t + "…"; }

  ctx.fillStyle = "#d9d9d9"; ctx.fillRect(pad, pad, w-pad*2, h-pad-bottom);

  if (opts.note) { ctx.font = `400 ${fs*.85}px ${FD}`; ctx.fillStyle = "#555"; ctx.fillText(fitText(ctx, opts.note, w - pad*2), pad, h - bottom*.3); }
  ctx.fillStyle = "rgba(255,214,140,.75)"; ctx.save(); ctx.translate(w/2, 0); ctx.rotate(-.05); ctx.fillRect(-w*.12, -14, w*.24, 30); ctx.restore();

const LAYOUTS = {
  1:[[0,0,1,1]], 2:[[0,0,1,.5],[0,.5,1,.5]], 3:[[0,0,1,.54],[0,.54,.5,.46],[.5,.54,.5,.46]],

async function drawCollage(){
