<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07131f">
<title>海豹漫遊基隆</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Mobile-first (iPhone 15 ≈ 393×852). One column ≤560px, thumb-zone actions: bottom dock on the list, bottom action bar in detail. */
:root{
  color-scheme:dark;
  --bg:#07131f; --bg-2:#0b1c2c; --surface:#0f2336; --surface-2:#15304a; --line:#1f3d5a;
  --fg:#e7f0f7; --muted:#9db4c7; --accent:#ffa865; --accent-ink:#2b1404; --danger:#ff8a8a; --teal:#5fd4c6; --ok:#71e0aa;
  --seal:#a9bccb; --seal-dark:#7d93a6; --seal-belly:#dce6ed; --seal-ink:#15202b; --blush:#ff9fb2;
  --paper:#fbf8f1; --paper-ink:#2b2b2b;
  --sky-1:#050e19; --sky-2:#143250; --moon:#fff1c9; --star-op:1; --hill:#0c2134; --hill-2:#102a42;
  --sea-1:#1c4b6f; --sea-2:#133b5a; --beam:rgba(255,234,170,.16); --bubble:rgba(150,205,240,.45);
  --shadow:0 14px 32px -16px rgba(0,0,0,.7);
  --f-display:"LXGW WenKai TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"Fredoka","Noto Sans TC",system-ui,sans-serif;
  --r:22px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  --bar-h:58px; --dock-h:66px; --fz:1; --g:12px;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#eaf2f8; --bg-2:#dde9f2; --surface:#ffffff; --surface-2:#f1f6fa; --line:#cddcea;
  --fg:#0d2135; --muted:#4a6680; --accent:#d9601f; --accent-ink:#ffffff; --danger:#c9362f; --teal:#0f7f75; --ok:#17885a;
  --seal:#9fb3c4; --seal-dark:#73899d; --seal-belly:#e4ecf2; --seal-ink:#15202b; --blush:#ff8ea4;
  --sky-1:#8fcaef; --sky-2:#e6f4fc; --moon:#ffe08a; --star-op:0; --hill:#7eb39f; --hill-2:#5f9a85;
  --sea-1:#58aedb; --sea-2:#3a8dc0; --beam:rgba(255,255,255,0); --bubble:rgba(255,255,255,.7);
  --shadow:0 14px 30px -18px rgba(20,60,100,.45);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:calc(var(--bar-h) + var(--safe-t) + 12px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:calc(18px * var(--fz));line-height:1.65;overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;padding-bottom:calc(var(--dock-h) + var(--safe-b))}
button,input,label,a{font:inherit;color:inherit}
button,label.btn{cursor:pointer;-webkit-user-select:none;user-select:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:10px}
.wrap{width:100%;max-width:640px;margin:0 auto;padding-left:max(var(--g),var(--safe-l));padding-right:max(var(--g),var(--safe-r))}
.sr{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);pointer-events:none}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0;line-height:1.25}
p{margin:0}
svg{display:block}

/* ambient bubbles */
.bubbles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bubbles span{position:absolute;bottom:-40px;border-radius:50%;border:1.5px solid var(--bubble);animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh) translateX(20px)}}

/* top bar */
.top{position:sticky;top:0;z-index:30;padding-top:var(--safe-t);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;height:var(--bar-h)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:50px;height:36px;flex:none}
.brand b{font-family:var(--f-display);font-size:calc(21px * var(--fz));display:block;line-height:1.2;white-space:nowrap}
.brand small{display:block;color:var(--muted);font-size:calc(14px * var(--fz));line-height:1.3;white-space:nowrap}
.icon-btn{width:46px;height:46px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.icon-btn svg{width:22px;height:22px}
.icon-btn:disabled{opacity:.3;cursor:default}

/* hero */
.hero{position:relative;z-index:1}
.hero-art{position:relative;max-width:640px;margin:0 auto;height:clamp(130px,36vw,200px);overflow:hidden}
.hero-art svg{width:100%;height:100%}
.hero-copy{position:relative;margin-top:-10px;display:grid;gap:6px}
.eyebrow{font-family:var(--f-num);font-weight:600;letter-spacing:.1em;font-size:calc(15px * var(--fz));color:var(--teal)}
.hero h1{font-size:calc(clamp(34px,9.4vw,44px) * var(--fz))}
.hero h1 em{font-style:normal;color:var(--accent)}
.lede{color:var(--muted);font-size:calc(17px * var(--fz));line-height:1.75}

main{position:relative;z-index:1;padding-block:14px 20px}

/* now card */
.now{border-radius:22px;padding:14px 14px 14px;display:grid;gap:10px;box-shadow:var(--shadow);
  background:linear-gradient(165deg,color-mix(in srgb,var(--accent) 18%,var(--surface)),var(--surface) 70%);
  border:1.5px solid color-mix(in srgb,var(--accent) 55%,var(--line))}
.now-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.now-tag{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:calc(16px * var(--fz));color:var(--accent)}
.now-tag svg{width:18px;height:18px}
.dot{position:relative;width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none}
.dot::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--accent);animation:ping 1.8s ease-out infinite}
.now-clock{font-family:var(--f-num);font-weight:600;font-size:calc(18px * var(--fz));font-variant-numeric:tabular-nums;color:var(--muted)}
.now-hit{display:grid;gap:4px;text-align:left;background:none;border:0;padding:0}
.now h2{font-size:calc(28px * var(--fz))}
.now-sub{color:var(--muted);font-size:calc(17px * var(--fz))}
.now-time{display:flex;justify-content:space-between;gap:10px;font-size:calc(16px * var(--fz));color:var(--muted);font-variant-numeric:tabular-nums}
.now-time b{font-family:var(--f-num);font-weight:600;color:var(--fg)}
.now-bar{height:8px;border-radius:99px;background:color-mix(in srgb,var(--line) 80%,transparent);overflow:hidden}
.now-bar i{display:block;height:100%;border-radius:inherit;background:var(--accent)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.duo.one{grid-template-columns:1fr}

/* progress strip */
.prog{margin-top:10px;padding:10px 8px 6px;border-radius:20px;background:var(--surface);border:1px solid var(--line);display:grid;gap:10px}
.prog-head{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px}
.prog-head b{font-size:calc(17px * var(--fz))}
.prog-head span{font-family:var(--f-num);font-weight:600;font-size:calc(17px * var(--fz));color:var(--ok);font-variant-numeric:tabular-nums}
.dots{display:grid;grid-template-columns:repeat(var(--n,7),minmax(0,1fr));gap:2px}
.dots button{display:grid;justify-items:center;gap:2px;background:none;border:0;padding:2px 0;min-height:60px}
.dots i{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--f-num);font-weight:600;font-size:calc(17px * var(--fz));border:2px solid var(--line);color:var(--muted);background:var(--bg)}
.dots i svg{width:20px;height:20px}
.dots small{font-size:calc(14px * var(--fz));line-height:1.2;color:var(--muted);white-space:nowrap}
.dots .past i{opacity:.55}
.dots .cur i{border-color:var(--accent);color:var(--accent)}
.dots .cur small{color:var(--accent);font-weight:700}
.dots .done i{background:var(--ok);border-color:var(--ok);color:#06231a;opacity:1}

/* list */
.section-title{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;column-gap:10px;margin:20px 2px 10px}
.section-title h2{font-size:calc(28px * var(--fz))}
.section-title span{color:var(--muted);font-size:calc(15px * var(--fz))}
.stops{list-style:none;margin:0;padding:0}
.stop{scroll-margin-top:calc(var(--bar-h) + var(--safe-t) + 12px)}
.card{border-radius:var(--r);overflow:hidden;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.stop[data-status="now"] .card,.stop[data-status="next"] .card{border:2px solid color-mix(in srgb,var(--accent) 75%,var(--line))}
.stop[data-status="past"] .card-hit{opacity:.72}
.stop[data-status="past"] .thumb svg{filter:saturate(.45)}
.card-hit{display:block;width:100%;text-align:left;border:0;padding:0;background:none;transition:transform .15s ease}
.card-hit:active{transform:scale(.985)}
.thumb{position:relative;aspect-ratio:16/7;overflow:hidden;background:var(--surface-2)}
.thumb>svg{width:100%;height:100%}
.chip,.num-badge{position:absolute;top:12px;font-size:calc(15px * var(--fz));font-weight:700;padding:4px 12px;border-radius:999px;background:rgba(7,19,31,.74);color:#fff;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);line-height:1.5}
.chip{left:12px}
.num-badge{right:12px;font-family:var(--f-num);font-weight:600;letter-spacing:.04em}
.chip.now{background:var(--accent);color:var(--accent-ink)}
.chip.done{background:var(--ok);color:#06231a}
.mini-pola{position:absolute;right:12px;bottom:-8px;width:clamp(76px,24%,104px);padding:5px 5px 15px;background:var(--paper);border-radius:3px;transform:rotate(5deg);box-shadow:0 8px 18px rgba(0,0,0,.4)}
.mini-pola img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#ddd}
.card-body{padding:12px 14px 2px;display:grid;gap:4px}
.time{display:flex;align-items:center;gap:10px;font-size:calc(16px * var(--fz));color:var(--muted);font-variant-numeric:tabular-nums}
.time b{font-family:var(--f-num);font-weight:600;font-size:calc(18px * var(--fz));color:var(--teal)}
.time .go{margin-left:auto;color:var(--accent);font-weight:700}
.card h3{font-size:calc(25px * var(--fz))}
.place{display:flex;align-items:flex-start;gap:6px;color:var(--muted);font-size:calc(17px * var(--fz));line-height:1.5}
.place svg{width:20px;height:20px;flex:none;margin-top:2px;color:var(--teal)}
.sum{font-size:calc(17px * var(--fz))}
.card-actions{position:relative;padding:10px 14px 14px}
.hop{display:flex;align-items:center;gap:8px;margin-left:24px;padding:8px 0 8px 16px;border-left:2px dashed var(--line);color:var(--muted);font-size:calc(15px * var(--fz))}
.hop svg{width:18px;height:18px;color:var(--teal);flex:none}

/* finale */
.finale{margin-top:20px;scroll-margin-top:calc(var(--bar-h) + var(--safe-t) + 12px);border-radius:22px;padding:16px 14px;background:linear-gradient(160deg,var(--surface-2),var(--surface));border:1px solid var(--line);display:grid;gap:12px}
.finale-head{display:flex;align-items:center;gap:12px}
.finale-head svg{width:80px;height:58px;flex:none}
.finale h2{font-size:calc(28px * var(--fz))}
.finale p{color:var(--muted);font-size:calc(17px * var(--fz))}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.slot{aspect-ratio:4/5;border-radius:10px;border:2px dashed var(--line);display:grid;place-items:center;align-content:center;gap:2px;font-family:var(--f-num);font-weight:600;font-size:calc(24px * var(--fz));color:var(--muted);background:transparent;padding:0;overflow:hidden}
.slot small{font-family:var(--f-body);font-size:calc(14px * var(--fz));font-weight:500}
.slot.has{border:none;background:var(--paper);padding:4px 4px 14px;transform:rotate(var(--rot));box-shadow:0 6px 14px rgba(0,0,0,.35)}
.slot.has img{width:100%;height:100%;object-fit:cover;display:block;border-radius:2px;background:#ddd}
.trip-over{display:inline-flex;gap:6px;align-items:center;font-size:calc(16px * var(--fz));font-weight:700;color:var(--ok)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:10px 14px;border-radius:16px;border:1px solid var(--line);background:var(--surface-2);font-size:calc(18px * var(--fz));font-weight:700;line-height:1.3;text-align:center;text-decoration:none;color:var(--fg);transition:transform .12s ease}
.btn:active{transform:scale(.97)}
.btn svg{width:22px;height:22px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.ok{background:color-mix(in srgb,var(--ok) 16%,var(--surface));border-color:color-mix(in srgb,var(--ok) 55%,var(--line));color:var(--ok)}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btn-row{display:flex;flex-wrap:wrap;gap:10px}
.btn-row .btn{flex:1 1 140px}

/* bottom dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;padding-bottom:var(--safe-b);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.dock-in{max-width:640px;margin:0 auto;height:var(--dock-h);display:grid;grid-template-columns:repeat(3,1fr);padding-left:var(--safe-l);padding-right:var(--safe-r)}
.dock button{display:grid;justify-items:center;align-content:center;gap:3px;background:none;border:0;padding:0;font-size:calc(14px * var(--fz));font-weight:700;color:var(--muted)}
.dock svg{width:26px;height:26px}
.dock .mid span{width:52px;height:36px;border-radius:18px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink)}
.dock .mid svg{width:24px;height:24px}
.dock .mid{color:var(--fg)}

/* sheets */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{opacity:0;transform:translateY(32px)}to{opacity:1;transform:none}}
.sheet-bar{position:sticky;top:0;z-index:5;padding-top:var(--safe-t);background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.sheet-bar .wrap{display:flex;align-items:center;gap:12px;height:var(--bar-h)}
.sheet-bar b{font-family:var(--f-display);font-size:calc(21px * var(--fz));flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-bar .step{font-family:var(--f-num);font-weight:600;font-size:calc(17px * var(--fz));color:var(--muted);font-variant-numeric:tabular-nums}
.d-art{max-width:640px;margin:0 auto;aspect-ratio:2/1;max-height:30vh;max-height:30dvh;width:100%;overflow:hidden}
.d-art svg{width:100%;height:100%}
.d-body{display:grid;gap:18px;padding-top:14px;padding-bottom:calc(var(--dock-h) + var(--safe-b) + 36px)}
.d-head{display:grid;gap:6px}
.d-head h1{font-size:calc(clamp(30px,8.6vw,40px) * var(--fz))}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.fact{display:inline-flex;align-items:center;gap:6px;font-size:calc(16px * var(--fz));padding:6px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.fact svg{width:18px;height:18px;flex:none;color:var(--teal)}
.fact b{font-family:var(--f-num);font-weight:600;font-variant-numeric:tabular-nums}
.d-intro{font-size:calc(18px * var(--fz));line-height:1.9}
.say{display:flex;gap:12px;align-items:center}
.say svg{width:84px;height:60px;flex:none}
.say p{position:relative;background:var(--surface-2);border:1px solid var(--line);padding:12px 16px;border-radius:18px 18px 18px 4px;font-family:var(--f-display);font-size:calc(18px * var(--fz))}
.sect{display:grid;gap:8px}
.sect h2{font-size:calc(24px * var(--fz));display:flex;align-items:center;gap:10px}
.sect h2 svg{width:26px;height:26px;flex:none;color:var(--accent)}
.list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.list li{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:9px 14px;font-size:calc(17px * var(--fz))}
.list li::before{content:"";width:9px;height:9px;margin-top:11px;border-radius:50%;background:var(--teal);flex:none}
.list.food li::before{background:var(--accent)}
.list.tips li::before{border-radius:2px;background:var(--muted)}
.route{list-style:none;margin:0;padding:0;display:grid}
.route li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;padding-bottom:8px;position:relative;font-size:calc(17px * var(--fz))}
.route li::before{content:"";width:14px;height:14px;border-radius:50%;border:3px solid var(--teal);margin:7px 0 0 3px;background:var(--bg);z-index:1}
.route li:not(:last-child)::after{content:"";position:absolute;left:9px;top:22px;bottom:0;width:2px;background:var(--line)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pager button{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 16px;min-width:0;min-height:68px}
.pager button:last-child{text-align:right}
.pager small{display:block;color:var(--muted);font-size:calc(15px * var(--fz))}
.pager span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;font-size:calc(17px * var(--fz))}
.pager .ghost{visibility:hidden}
.swipe-hint{text-align:center;color:var(--muted);font-size:calc(15px * var(--fz))}

/* detail action bar (thumb zone) */
.d-actions{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:10px max(12px,var(--safe-r)) calc(10px + var(--safe-b)) max(12px,var(--safe-l));background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.d-actions .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:48px minmax(0,1fr) minmax(0,1fr) 48px;gap:6px;align-items:center}
.d-actions .icon-btn{width:48px;height:54px;border-radius:16px}
.d-actions .btn,.duo .btn{white-space:nowrap;padding-inline:10px}
.d-actions .btn{width:100%}
.d-actions .btn svg{display:none}
@media (min-width:380px){.d-actions .btn svg{display:block}}
.d-check{display:contents}

/* check-in */
.checkin{scroll-margin-top:calc(var(--bar-h) + var(--safe-t) + 12px);border-radius:22px;padding:14px;background:linear-gradient(170deg,color-mix(in srgb,var(--accent) 14%,var(--surface)),var(--surface));border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));display:grid;gap:14px}
.checkin h2{font-size:calc(25px * var(--fz))}
.checkin>p{color:var(--muted);font-size:calc(17px * var(--fz))}
.drop{display:grid;place-items:center;gap:6px;text-align:center;padding:16px 12px;min-height:170px;border:2px dashed color-mix(in srgb,var(--accent) 55%,var(--line));border-radius:20px;cursor:pointer;transition:background .2s}
.drop:active,.drop.over{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.drop svg{width:120px;height:86px}
.drop b{font-size:calc(21px * var(--fz))}
.drop span{color:var(--muted);font-size:calc(16px * var(--fz))}
.drop.busy{pointer-events:none;opacity:.7}
.pola-wrap{display:grid;place-items:center;padding:10px 0 4px}

/* ---------- check-in storage (IndexedDB in this browser) ---------- */
const checkins = {};   // id -> {blob, url, note, at}
let dbP = null;
function db(){
  if (!dbP) dbP = new Promise((res, rej) => {
    try { const r = indexedDB.open("seal-keelung", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("checkins");
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    } catch (e) { rej(e); }
  });
  return dbP;
}
async function dbAll(){
  try { const d = await db(); return await new Promise((res, rej) => {
    const out = {}, tx = d.transaction("checkins"), st = tx.objectStore("checkins"), cur = st.openCursor();
    cur.onsuccess = () => { const c = cur.result; if (c) { out[c.key] = c.value; c.continue(); } else res(out); };
    cur.onerror = () => rej(cur.error); });
  } catch { return {}; }
}
async function dbPut(key, val){ try { const d = await db(); d.transaction("checkins","readwrite").objectStore("checkins").put(val, key); return true; } catch { return false; } }
async function dbDel(key){ try { const d = await db(); d.transaction("checkins","readwrite").objectStore("checkins").delete(key); } catch {} }

function loadImg(src){ return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("decode")); i.src = src; }); }
async function processPhoto(file){
  if (!file || !/^image\//.test(file.type || "image/")) throw new Error("請選擇照片檔（JPG、PNG 或 WebP）");
  const url = URL.createObjectURL(file);
  try {
    const img = await loadImg(url).catch(() => { throw new Error("這張照片的格式無法讀取，請改用 JPG 或 PNG"); });
    const max = 1600, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth*k); c.height = Math.round(img.naturalHeight*k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", .9));
    if (!blob) throw new Error("照片處理失敗，請再試一次");
    return blob;
  } finally { URL.revokeObjectURL(url); }
}
function setCheckin(id, rec){
  if (checkins[id]?.url) URL.revokeObjectURL(checkins[id].url);
  if (!rec) { delete checkins[id]; return; }
  checkins[id] = { ...rec, url: URL.createObjectURL(rec.blob) };
}
function guardImages(root){
  root.querySelectorAll("img[data-photo]").forEach(img => img.addEventListener("error", () => {
    const f = img.closest(".pola"); if (f) f.classList.add("broken"); else img.style.visibility = "hidden";
  }, { once:true }));
}

/* ---------- status by clock ---------- */
let statusMap = {};
const nowMins = () => { const d = new Date(); return d.getHours()*60 + d.getMinutes(); };
function computeStatus(){
  const t = nowMins();
  let flagged = false; statusMap = {};
  STOPS.forEach(s => {
    const a = mins(s.start), b = mins(s.end);
    if (t > b) statusMap[s.id] = "past";
    else if (t >= a) { statusMap[s.id] = flagged ? "future" : "now"; flagged = true; }
    else { statusMap[s.id] = flagged ? "future" : "next"; flagged = true; }
  });
  return t;
}
const tripOver = () => STOPS.every(s => statusMap[s.id] === "past");
const doneCount = () => STOPS.filter(s => checkins[s.id]).length;
const currentStop = () => STOPS.find(s => ["now","next"].includes(statusMap[s.id]));
const fmtDur = m => m >= 60 ? `${Math.floor(m/60)} 小時${m%60 ? ` ${m%60} 分` : ""}` : `${m} 分鐘`;

}

}
function drawRoute(ctx, active){

function cover(ctx, img, x, y, w, h){

  ctx.shadowColor = "rgba(0,0,0,.5)"; ctx.shadowBlur = 30; ctx.shadowOffsetY = 12;

}

const LAYOUTS = {
  1:[[0,0,1,1]], 2:[[0,0,1,.5],[0,.5,1,.5]], 3:[[0,0,1,.54],[0,.54,.5,.46],[.5,.54,.5,.46]],
  4:[[0,0,.5,.5],[.5,0,.5,.5],[0,.5,.5,.5],[.5,.5,.5,.5]],
  5:[[0,0,.5,.45],[.5,0,.5,.45],[0,.45,1/3,.55],[1/3,.45,1/3,.55],[2/3,.45,1/3,.55]],
  6:[[0,0,.5,1/3],[.5,0,.5,1/3],[0,1/3,.5,1/3],[.5,1/3,.5,1/3],[0,2/3,.5,1/3],[.5,2/3,.5,1/3]],
  7:[[0,0,.5,.34],[.5,0,.5,.34],[0,.34,1/3,.32],[1/3,.34,1/3,.32],[2/3,.34,1/3,.32],[0,.66,.5,.34],[.5,.66,.5,.34]]
};
async function drawCollage(){
  await ensureFonts();
  const c = document.createElement("canvas"); c.width = CW; c.height = CH; const ctx = c.getContext("2d");
  drawBg(ctx);
  const done = STOPS.filter(s => checkins[s.id]);
  ctx.fillStyle = "#e7f0f7"; ctx.font = `700 74px ${FD}`; ctx.fillText("基隆海豹散步日記", 64, 128);
  ctx.fillStyle = "#8ec7e6"; ctx.font = `600 32px ${FN}`; ctx.fillText(`${tripDate()}  ·  ${done.length} / ${STOPS.length} STOPS`, 66, 182);
  drawSeal(ctx, 820, 20, 1.6, false);
  const rots = [-2.6,2.2,-1.6,2.8,-2.2,1.6,-2,2.4], ax = 56, ay = 236, aw = 968, ah = 940;
  const L = LAYOUTS[done.length];
  for (let i = 0; i < done.length; i++){
    const s = done[i], [fx,fy,fw,fh] = L[i], m = 16;
    const img = await photoImg(s.id);
    polaroid(ctx, img, ax+fx*aw+m, ay+fy*ah+m, fw*aw-m*2, fh*ah-m*2, rots[i], `${STOPS.indexOf(s)+1}. ${s.place.replace(/ → .*/,"")}`, s.start);
  }
  drawRoute(ctx, -1);
  return c;
}
async function drawStopPage(s){
  const c = document.createElement("canvas"); c.width = CW; c.height = CH; const ctx = c.getContext("2d");
  drawBg(ctx);
  const i = STOPS.indexOf(s), rec = checkins[s.id];
  ctx.fillStyle = "#5fd4c6"; ctx.font = `600 30px ${FN}`; ctx.fillText(`STOP ${pad(i+1)}  ·  ${s.start}–${s.end}`, 66, 110);
  ctx.fillStyle = "#e7f0f7"; ctx.font = `700 66px ${FD}`; ctx.fillText(fitText(ctx, s.title, 700), 64, 186);
  drawSeal(ctx, 840, 50, 1.3, i === STOPS.length - 1);
  const img = await photoImg(s.id);
  polaroid(ctx, img, 110, 250, 860, 950, -1.4, s.place, "", { bottom: 150, note: rec?.note || s.seal });
  drawRoute(ctx, i);
  return c;
}
const canvasBlob = (c, type = "image/jpeg", q = .92) => new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error("export")), type, q));

/* ---------- downloads ---------- */
let dlP = null;
function getDownloads(){
  if (!window.claude || typeof window.claude.use !== "function") return Promise.resolve(null);
  if (!dlP) dlP = Promise.resolve(window.claude.use("downloads")).catch(() => null);
  return dlP;
}
async function saveFile(name, blob){
  const dl = await getDownloads();
  if (dl) {
    try { await dl.save({ filename: name, data: blob }); toast(`已下載 ${name}`); }
    catch (e) {
      const code = e && e.code;
      toast(code === "declined" ? "已取消下載" : code === "rate_limited" ? "下載視窗已經開著，請先處理它" : "這個檢視無法下載檔案");
    }
    return;
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  toast(`已下載 ${name}`);
}

/* ---------- collage sheet ---------- */
let collageCanvas = null;
async function openCollage(){
  const el = $("#collage");
  el.innerHTML = `
    <div class="sheet-bar"><div class="wrap"><button class="icon-btn" type="button" data-close-collage aria-label="返回">${ICON.back}</button><b>旅程拼貼</b></div></div>
    <div class="wrap c-body">
      <div class="c-prev" id="cPrev"><div class="loading">${sealSVG({bob:true})}<span>海豹正在排照片…</span></div></div>
      <div class="btn-row">
        <button class="btn primary" type="button" id="dlPdf" disabled>${ICON.dl} 下載 PDF</button>
        <button class="btn" type="button" id="dlJpg" disabled>${ICON.dl} 下載 IG 圖片</button>
        <button class="btn" type="button" id="shareBtn" hidden>${ICON.share} 分享</button>
      </div>
      <p class="hint">PDF 第 1 頁是整天的拼貼，後面每個打卡站各一頁，每頁都是 1080×1350（IG 4:5）。IG 不能直接上傳 PDF，要發文請用「下載 IG 圖片」的 JPG。</p>
    </div>`;
  el.hidden = false; el.scrollTop = 0; document.body.style.overflow = "hidden";
  try { if (!(history.state && history.state.collage)) history.pushState({ collage:1 }, "", location.pathname + location.search + "#collage"); } catch {}
  el.querySelector("[data-close-collage]").addEventListener("click", closeCollage);
  try {
    collageCanvas = await drawCollage();
    const url = collageCanvas.toDataURL("image/jpeg", .9);
    $("#cPrev").innerHTML = `<img src="${url}" alt="旅程拼貼預覽">`;
    $("#dlJpg").disabled = false; $("#dlPdf").disabled = !window.jspdf;
    if (!window.jspdf) $("#dlPdf").title = "PDF 元件沒有載入，請重新整理頁面";
    $("#dlJpg").addEventListener("click", async () => saveFile(`keelung-seal-${tripDate().replace(/\./g,"")}.jpg`, await canvasBlob(collageCanvas)));
    $("#dlPdf").addEventListener("click", makePdf);
    const sb = $("#shareBtn");
    if (navigator.canShare && !window.claude) {
      const probe = new File([new Blob(["x"])], "a.jpg", { type:"image/jpeg" });
      try { if (navigator.canShare({ files:[probe] })) { sb.hidden = false; sb.addEventListener("click", async () => {
        try { const f = new File([await canvasBlob(collageCanvas)], "keelung-seal.jpg", { type:"image/jpeg" });
          await navigator.share({ files:[f], title:"基隆海豹散步日記" }); }
        catch (e) { if (e.name !== "AbortError") toast("這裡無法開啟分享，請改用下載 IG 圖片"); } }); } } catch {}
    }
  } catch {
    $("#cPrev").innerHTML = `<p class="hint">拼貼製作失敗，請重新整理後再試一次。</p>`;
  }
}
async function makePdf(){
  const btn = $("#dlPdf"); btn.disabled = true; const label = btn.innerHTML; btn.textContent = "製作 PDF 中…";
  try {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation:"portrait", unit:"px", format:[CW, CH], hotfixes:["px_scaling"], compress:true });
    doc.addImage(collageCanvas.toDataURL("image/jpeg", .9), "JPEG", 0, 0, CW, CH);
    for (const s of STOPS.filter(s => checkins[s.id])) {
      const c = await drawStopPage(s);
      doc.addPage([CW, CH], "portrait"); doc.addImage(c.toDataURL("image/jpeg", .88), "JPEG", 0, 0, CW, CH);
    }
    await saveFile(`keelung-seal-${tripDate().replace(/\./g,"")}.pdf`, doc.output("blob"));
  } catch { toast("PDF 製作失敗，可以先下載 IG 圖片"); }
  btn.disabled = false; btn.innerHTML = label;
}

/* ---------- misc ---------- */
let toastT;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2600); }

function themeIcon(){
  const r = document.documentElement.getAttribute("data-theme");
  $("#themeBtn").innerHTML = r === "light" ? ICON.moon : ICON.sun;
}
function initTheme(){
  try { const t = localStorage.getItem("seal-theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch {}
  themeIcon();
  $("#themeBtn").addEventListener("click", () => {
    const next = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("seal-theme", next); } catch {}
    themeIcon();
  });
}
/* ---------- text size ---------- */
const FZ_KEY = "seal-fz", FZ_DEFAULT = "1";
function applyFz(v){
  document.documentElement.style.setProperty("--fz", v);
  document.querySelectorAll("[data-fz]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.fz === v)));
}
function initFz(){
  let v = FZ_DEFAULT; try { v = localStorage.getItem(FZ_KEY) || FZ_DEFAULT; } catch {}
  if (![...document.querySelectorAll("[data-fz]")].some(b => b.dataset.fz === v)) v = FZ_DEFAULT;
  applyFz(v);
  const pop = $("#fzPop");
  document.addEventListener("click", e => {
    if (e.target.closest("[data-fz-open]")) { pop.hidden = !pop.hidden; return; }
    const b = e.target.closest("[data-fz]");
    if (b) { applyFz(b.dataset.fz); try { localStorage.setItem(FZ_KEY, b.dataset.fz); } catch {} return; }
    if (e.target.closest("[data-fz-close]") || (!pop.hidden && !e.target.closest("#fzPop"))) pop.hidden = true;
  });
}
function initBubbles(){
  const b = $("#bubbles"); let html = "";
  for (let i=0;i<12;i++){ const s = 6 + (i*7)%18;
    html += `<span style="left:${(i*37)%100}%;width:${s}px;height:${s}px;animation-duration:${14+(i*5)%16}s;animation-delay:-${(i*3)%14}s"></span>`; }
  b.innerHTML = html;
}

function scrollToEl(el){ if (el) el.scrollIntoView({ behavior: RM ? "auto" : "smooth", block:"start" }); }
function dock(action){
  if (action === "list") return scrollToEl($("#listTop"));
  if (action === "collage") return scrollToEl($("#finale"));
  if (action === "now") { const c = currentStop(); if (c) openDetail(c.id); else scrollToEl($("#finale")); }
}
document.addEventListener("click", e => {
  const o = e.target.closest("[data-open]");
  if (o) { const focus = o.dataset.focus; openDetail(o.dataset.open, openId ? "replace" : "push");
    if (focus) requestAnimationFrame(() => { const t = $("#" + focus); if (t) t.scrollIntoView({ block:"start" }); });
    return; }
  if (e.target.closest("[data-close]")) return closeDetail();
  const j = e.target.closest("[data-jump]"); if (j) return scrollToEl(document.getElementById("card-" + j.dataset.jump));
  const d = e.target.closest("[data-dock]"); if (d) return dock(d.dataset.dock);
  if (e.target.closest("[data-scroll-ci]")) return scrollToEl($("#ci"));
});
/* camera / picker from list cards and the now card */
document.addEventListener("change", e => {
  const inp = e.target.closest("input[data-file]"); if (!inp) return;
  const s = STOPS.find(x => x.id === inp.dataset.file), f = inp.files[0]; inp.value = "";
  if (s && f) handleFile(s, f);
});
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (!$("#fzPop").hidden) { $("#fzPop").hidden = true; return; }
  if (!$("#collage").hidden) closeCollage();
  else if (!$("#detail").hidden) closeDetail();
});
/* swipe left / right in the detail sheet to change stop */
(() => {
  const el = $("#detail"); let x0 = null, y0 = 0, t0 = 0;
  el.addEventListener("touchstart", e => {
    if (e.touches.length !== 1 || e.target.closest("input,.d-actions")) { x0 = null; return; }
    const t = e.touches[0]; if (t.clientX < 28) { x0 = null; return; } /* leave the edge to the browser back gesture */ x0 = t.clientX; y0 = t.clientY; t0 = Date.now();
  }, { passive:true });
  el.addEventListener("touchend", e => {
    if (x0 === null || !openId) return;
    const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0; x0 = null;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 2 && Date.now() - t0 < 700) {
      const i = STOPS.findIndex(s => s.id === openId), n = STOPS[i + (dx < 0 ? 1 : -1)];
      if (n) openDetail(n.id, "replace");
    }
  }, { passive:true });
})();

async function init(){
  $("#brand").innerHTML = `${sealSVG({})}<div><b>海豹漫遊基隆</b><small>開車港都一日遊</small></div>`;
  $("#heroArt").innerHTML = heroSVG();
  const d = new Date(); $("#dayLabel").textContent = `${d.getMonth()+1} 月 ${d.getDate()} 日 · 依現在時間標示進度`;
  initTheme(); initFz(); initBubbles(); renderAll();
  const saved = await dbAll();
  Object.entries(saved).forEach(([k, v]) => { if (v && v.blob && STOPS.some(s => s.id === k)) setCheckin(k, v); });
  renderAll();
  const h = (location.hash || "").slice(1);
  if (STOPS.some(s => s.id === h)) openDetail(h, "none");
  const tick = () => { const before = JSON.stringify(statusMap); computeStatus();
    if (openId) return; if (JSON.stringify(statusMap) !== before) renderAll(); else renderNow(); };
  setInterval(tick, 30000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
  getDownloads();
}
init();
</script>
